<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Clackworks — the paper marble machine</title>
<meta name="description" content="Clackworks: a cozy paper-craft marble machine idle game. Watch it clack, buy upgrades on the fly, rebuild bigger.">
<meta name="theme-color" content="#e9dcc3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="ticket" id="bankBox">
      <div class="bankRow"><span class="spark">✦</span><span id="bank">0</span></div>
      <div id="cps">0 / sec</div>
    </div>
    <div class="topRight">
      <button class="chip" id="gearChip" hidden aria-label="Rebuild and Gear Tree"><span class="gearIcon"></span><b id="gearCount">0</b><em id="gearGain"></em><i class="dot" hidden></i></button>
      <button class="iconBtn" id="trophyBtn" hidden aria-label="Trophies">★<i class="dot" hidden></i></button>
      <button class="iconBtn" id="muteBtn" aria-label="Sound on/off">♪</button>
    </div>
  </header>

  <section id="stage">
    <canvas id="cv"></canvas>
    <div id="buffs"></div>
    <div id="banner"></div>
    <div id="stageHint" hidden>tap marbles to pop them ✦</div>
  </section>

  <section id="dock">
    <div id="boostRow">
      <button id="turbo" hidden aria-label="Turbo lever"><i id="turboFill"></i><span class="lv"></span><b>TURBO</b><small id="turboTxt"></small></button>
      <button id="goal"><span class="lbl" id="goalLbl">NEXT</span><span id="goalName">—</span><span class="bar"><i id="goalBar"></i></span><span id="goalEta"></span></button>
      <button id="autoBtn" hidden aria-label="Auto-Builder on/off"><span class="bot"></span><b>AUTO</b><small id="autoTxt">ON</small></button>
    </div>
    <div id="shopTabs">
      <button data-tab="gadgets" class="on">Gadgets<i class="dot" hidden></i></button>
      <button data-tab="upgrades">Upgrades<i class="dot" hidden></i></button>
      <div id="buyMode"><button data-n="1" class="on">×1</button><button data-n="10">×10</button><button data-n="max">MAX</button></div>
    </div>
    <div id="grid"></div>
  </section>

  <div id="panel" hidden><div class="pcard"><button class="close" id="panelClose" aria-label="Close">✕</button><div id="panelBody"></div></div></div>
  <div id="pops"></div>
  <div id="toasts"></div>
  <div id="modal" hidden><div class="card" id="modalCard"></div></div>
  <div id="flash"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
